apiVersion: apps/v1
kind: Deployment
metadata:
  name: lindeman-it
  namespace: www
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lindeman-it
  template:
    metadata:
      labels:
        app: lindeman-it
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: nginx
        image: ghcr.io/mightymax/www.lindeman.it:26c82ebf93ec44a516f4dbf3e5371b5a7eb47828
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lindeman-it
  namespace: www
spec:
  selector:
    app: lindeman-it
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lindeman-it
  namespace: www
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: lindeman.it
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lindeman-it
            port:
              number: 80
  - host: "*.lindeman.it"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lindeman-it
            port:
              number: 80
  - host: lindeman.nu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lindeman-it
            port:
              number: 80
  - host: "*.lindeman.nu"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lindeman-it
            port:
              number: 80
